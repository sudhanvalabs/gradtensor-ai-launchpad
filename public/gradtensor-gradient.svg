<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">The GradTensor Gradient - 4-Level AI Mastery Framework</title>
  <desc id="desc">A four-level progression from AI Foundations to AI Orchestrator: Level 1 Conversations with AI, Level 2 Prompts and Prompt Chains, Level 3 AI Agents, Level 4 Multi-Agent Workflows.</desc>

  <defs>
    <style>
      .serif       { font-family: 'Instrument Serif', 'Georgia', serif; }
      .sans        { font-family: 'Satoshi', 'Inter', system-ui, sans-serif; }
      .mono        { font-family: 'DM Mono', 'JetBrains Mono', 'Menlo', monospace; }
    </style>
  </defs>

  <!-- Paper background -->
  <rect width="1200" height="920" fill="#F7F5F0"/>

  <!-- Top banner -->
  <text x="600" y="46" text-anchor="middle" class="mono" font-size="11" fill="#2D6A4F" letter-spacing="2.5">
    LEVELS 1-2: BETTER CONSUMERS    |    LEVELS 3-4: REAL CREATORS AND ORCHESTRATORS
  </text>
  <line x1="180" y1="60" x2="1020" y2="60" stroke="#52B788" stroke-width="1.5"/>

  <!-- Title -->
  <text x="600" y="118" text-anchor="middle" class="serif" font-size="52" fill="#0A0F1E">
    The GradTensor Gradient
  </text>

  <!-- Subtitle (green) -->
  <text x="600" y="152" text-anchor="middle" class="sans" font-size="18" font-weight="600" fill="#2D6A4F">
    Our Proprietary 4-Level AI Mastery Framework
  </text>

  <!-- Sub-subtitle -->
  <text x="600" y="178" text-anchor="middle" class="sans" font-size="14" fill="#6B7080">
    From AI Consumer to AI Orchestrator
  </text>

  <!-- ===================== CARDS ===================== -->
  <!-- 4 cards bottom-aligned at y=830, ascending heights, x-positions: 44, 328, 612, 896 -->

  <!-- ===== LEVEL 1 - AI Foundations (amber) ===== -->
  <g transform="translate(44, 430)">
    <rect width="260" height="400" rx="14" fill="#FFFAEB" stroke="#E9A800" stroke-width="1.5" stroke-opacity="0.6"/>

    <!-- Level badge -->
    <rect x="24" y="24" width="74" height="22" rx="4" fill="#E9A800"/>
    <text x="61" y="39" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#3F2E00" letter-spacing="2">LEVEL 1</text>

    <!-- Icon: BookOpen (book/lightbulb) -->
    <rect x="24" y="64" width="52" height="52" rx="10" fill="#FCEFC9" stroke="#E9A800" stroke-opacity="0.4"/>
    <g transform="translate(36, 76)" stroke="#A36A00" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
      <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
    </g>

    <!-- Name -->
    <text x="24" y="148" class="serif" font-size="26" fill="#0A0F1E">AI Foundations</text>

    <!-- Tagline -->
    <text x="24" y="174" class="sans" font-size="14" font-weight="600" fill="#A36A00">Become AI-Native</text>

    <!-- Operational term pill -->
    <rect x="24" y="194" width="186" height="24" rx="5" fill="#FCEFC9" stroke="#E9A800" stroke-opacity="0.4"/>
    <text x="32" y="211" class="mono" font-style="italic" font-size="11" fill="#A36A00">Conversations with AI</text>

    <!-- Description -->
    <text x="24" y="246" class="sans" font-size="13" fill="#4A4F5C">
      <tspan x="24" dy="0">Using AI tools confidently for</tspan>
      <tspan x="24" dy="18">everyday questions and tasks.</tspan>
    </text>
  </g>

  <!-- ===== LEVEL 2 - AI Proficiency (primary) ===== -->
  <g transform="translate(328, 390)">
    <rect width="260" height="440" rx="14" fill="#EAF5EE" stroke="#2D6A4F" stroke-width="1.5" stroke-opacity="0.6"/>

    <!-- Level badge -->
    <rect x="24" y="24" width="74" height="22" rx="4" fill="#2D6A4F"/>
    <text x="61" y="39" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#FFFFFF" letter-spacing="2">LEVEL 2</text>

    <!-- Icon: Code2 -->
    <rect x="24" y="64" width="52" height="52" rx="10" fill="#D8F3DC" stroke="#52B788" stroke-opacity="0.4"/>
    <g transform="translate(36, 76)" stroke="#1B4332" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="m18 16 4-4-4-4"/>
      <path d="m6 8-4 4 4 4"/>
      <path d="m14.5 4-5 16"/>
    </g>

    <!-- Name -->
    <text x="24" y="148" class="serif" font-size="26" fill="#0A0F1E">AI Proficiency</text>

    <!-- Tagline -->
    <text x="24" y="174" class="sans" font-size="14" font-weight="600" fill="#2D6A4F">Become Fluent</text>

    <!-- Operational term pill -->
    <rect x="24" y="194" width="212" height="24" rx="5" fill="#D8F3DC" stroke="#52B788" stroke-opacity="0.4"/>
    <text x="32" y="211" class="mono" font-style="italic" font-size="11" fill="#1B4332">Prompts and Prompt Chains</text>

    <!-- Description -->
    <text x="24" y="246" class="sans" font-size="13" fill="#4A4F5C">
      <tspan x="24" dy="0">Crafted prompts and human-</tspan>
      <tspan x="24" dy="18">sequenced workflows that</tspan>
      <tspan x="24" dy="18">compress multi-step work.</tspan>
    </text>
  </g>

  <!-- ===== LEVEL 3 - AI Agent Builder (primary) ===== -->
  <g transform="translate(612, 350)">
    <rect width="260" height="480" rx="14" fill="#EAF5EE" stroke="#2D6A4F" stroke-width="1.5" stroke-opacity="0.6"/>

    <!-- Level badge -->
    <rect x="24" y="24" width="74" height="22" rx="4" fill="#2D6A4F"/>
    <text x="61" y="39" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#FFFFFF" letter-spacing="2">LEVEL 3</text>

    <!-- Icon: Network (hub-and-spoke) -->
    <rect x="24" y="64" width="52" height="52" rx="10" fill="#D8F3DC" stroke="#52B788" stroke-opacity="0.4"/>
    <g transform="translate(36, 76)" stroke="#1B4332" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="16" y="16" width="6" height="6" rx="1"/>
      <rect x="2" y="16" width="6" height="6" rx="1"/>
      <rect x="9" y="2" width="6" height="6" rx="1"/>
      <path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"/>
      <path d="M12 12V8"/>
    </g>

    <!-- Name -->
    <text x="24" y="148" class="serif" font-size="26" fill="#0A0F1E">AI Agent Builder</text>

    <!-- Tagline -->
    <text x="24" y="174" class="sans" font-size="14" font-weight="600" fill="#2D6A4F">Become a Builder</text>

    <!-- Operational term pill -->
    <rect x="24" y="194" width="100" height="24" rx="5" fill="#D8F3DC" stroke="#52B788" stroke-opacity="0.4"/>
    <text x="32" y="211" class="mono" font-style="italic" font-size="11" fill="#1B4332">AI Agents</text>

    <!-- Description -->
    <text x="24" y="246" class="sans" font-size="13" fill="#4A4F5C">
      <tspan x="24" dy="0">Purpose-built AI with tools and</tspan>
      <tspan x="24" dy="18">context, deployed to do real</tspan>
      <tspan x="24" dy="18">work.</tspan>
    </text>
  </g>

  <!-- ===== LEVEL 4 - AI Orchestrator (primary) ===== -->
  <g transform="translate(896, 310)">
    <rect width="260" height="520" rx="14" fill="#EAF5EE" stroke="#2D6A4F" stroke-width="1.5" stroke-opacity="0.6"/>

    <!-- Level badge -->
    <rect x="24" y="24" width="74" height="22" rx="4" fill="#2D6A4F"/>
    <text x="61" y="39" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#FFFFFF" letter-spacing="2">LEVEL 4</text>

    <!-- Icon: Workflow -->
    <rect x="24" y="64" width="52" height="52" rx="10" fill="#D8F3DC" stroke="#52B788" stroke-opacity="0.4"/>
    <g transform="translate(36, 76)" stroke="#1B4332" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect width="8" height="8" x="3" y="3" rx="2"/>
      <path d="M7 11v4a2 2 0 0 0 2 2h4"/>
      <rect width="8" height="8" x="13" y="13" rx="2"/>
    </g>

    <!-- Name -->
    <text x="24" y="148" class="serif" font-size="26" fill="#0A0F1E">AI Orchestrator</text>

    <!-- Tagline -->
    <text x="24" y="174" class="sans" font-size="14" font-weight="600" fill="#2D6A4F">Become an Orchestrator</text>

    <!-- Operational term pill -->
    <rect x="24" y="194" width="190" height="24" rx="5" fill="#D8F3DC" stroke="#52B788" stroke-opacity="0.4"/>
    <text x="32" y="211" class="mono" font-style="italic" font-size="11" fill="#1B4332">Multi-Agent Workflows</text>

    <!-- Description -->
    <text x="24" y="246" class="sans" font-size="13" fill="#4A4F5C">
      <tspan x="24" dy="0">Systems where agents</tspan>
      <tspan x="24" dy="18">coordinate and hand off to</tspan>
      <tspan x="24" dy="18">deliver outcomes.</tspan>
    </text>
  </g>

  <!-- ===================== CONNECTING CHEVRONS ===================== -->
  <!-- Between cards, around the visual midpoint of the cards -->
  <g stroke="#52B788" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.55">
    <!-- Between L1 and L2 (at L2 mid-height ~y=610) -->
    <path d="M312 610 l8 -8 -8 -8"/>
    <!-- Between L2 and L3 -->
    <path d="M596 610 l8 -8 -8 -8"/>
    <!-- Between L3 and L4 -->
    <path d="M880 610 l8 -8 -8 -8"/>
  </g>

  <!-- ===================== FOOTER ===================== -->
  <line x1="180" y1="850" x2="1020" y2="850" stroke="#DDD8CE" stroke-width="1"/>

  <text x="600" y="876" text-anchor="middle" class="sans" font-size="13" fill="#6B7080">
    For Corporates, Working Professionals, and Educational Institutions
  </text>

  <!-- Logo (text mark, bottom right) -->
  <g transform="translate(1020, 894)">
    <text class="sans" font-size="16" font-weight="700" fill="#2D6A4F">Grad</text>
    <text x="44" class="sans" font-size="16" font-weight="700" fill="#0A0F1E">Tensor</text>
  </g>

  <!-- Tagline (bottom left) -->
  <text x="44" y="908" class="mono" font-size="10" fill="#2D6A4F" letter-spacing="1">
    // gradtensor.com
  </text>
</svg>
