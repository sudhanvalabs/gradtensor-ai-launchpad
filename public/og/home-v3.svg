<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f4efe6" />

  <!-- ===================== LEFT: TITLE BLOCK ===================== -->
  <g font-family="Fraunces, Georgia, 'Times New Roman', serif">
    <!-- Wordmark -->
    <text x="90" y="150" font-size="34" font-weight="700" letter-spacing="0.2">
      <tspan fill="#5fb32d">Grad</tspan><tspan fill="#1a1814">Tensor</tspan>
    </text>

    <!-- Headline -->
    <g font-weight="700" font-size="52">
      <text x="88" y="248" fill="#1a1814">Governed AI,</text>
      <text x="88" y="310" fill="#3d861d">decided and</text>
      <text x="88" y="372" fill="#3d861d">delivered.</text>
    </g>

    <!-- Green rule -->
    <rect x="90" y="402" width="58" height="4" fill="#5fb32d" />

    <!-- Subline -->
    <g fill="#6b645a" font-size="18" font-style="italic">
      <text x="90" y="440">A specialist AI consultancy with its own method,</text>
      <text x="90" y="465">the Judgment Line, and its own tool, Forge.</text>
    </g>
  </g>

  <!-- ===================== RIGHT: FORGE + FOUR PRODUCTS ===================== -->
  <g font-family="Fraunces, Georgia, 'Times New Roman', serif">

    <!-- Connectors (chip -> hexagon vertex) -->
    <g fill="none" stroke="#1a1814" stroke-width="1.5" opacity="0.4" stroke-dasharray="4 5">
      <path d="M 762,203 L 816,259" />
      <path d="M 1028,203 L 954,259" />
      <path d="M 762,419 L 816,341" />
      <path d="M 1028,419 L 954,341" />
    </g>

    <!-- Hexagon vertex nodes -->
    <circle cx="817.45" cy="261" r="5" fill="#5fb32d" />
    <circle cx="952.55" cy="261" r="5" fill="#1a1814" />
    <circle cx="817.45" cy="339" r="5" fill="#1a1814" />
    <circle cx="952.55" cy="339" r="5" fill="#5fb32d" />

    <!-- Forge hexagon (the tool) -->
    <polygon points="885,222 952.55,261 952.55,339 885,378 817.45,339 817.45,261"
             fill="#f4efe6" stroke="#1a1814" stroke-width="3" stroke-linejoin="round" />
    <polygon points="885,222 952.55,261 952.55,339 885,378 817.45,339 817.45,261"
             fill="#5fb32d" opacity="0.08" />
    <text x="885" y="292" text-anchor="middle" font-family="ui-monospace, Menlo, monospace"
          font-size="11" letter-spacing="2.5" fill="#3d861d">PLATFORM</text>
    <text x="885" y="322" text-anchor="middle" font-size="30" font-weight="700" fill="#1a1814">Forge</text>

    <!-- Product chips -->
    <!-- Copilots (Create) -->
    <g>
      <rect x="650" y="137" width="170" height="66" rx="12" fill="#f4efe6" stroke="#1a1814" stroke-width="2.5" />
      <text x="735" y="164" text-anchor="middle" font-family="ui-monospace, Menlo, monospace"
            font-size="12" letter-spacing="2" fill="#3d861d">CREATE</text>
      <text x="735" y="189" text-anchor="middle" font-size="23" font-weight="600" fill="#1a1814">Copilots</text>
    </g>
    <!-- Experts (Ask) -->
    <g>
      <rect x="970" y="137" width="170" height="66" rx="12" fill="#f4efe6" stroke="#1a1814" stroke-width="2.5" />
      <text x="1055" y="164" text-anchor="middle" font-family="ui-monospace, Menlo, monospace"
            font-size="12" letter-spacing="2" fill="#3d861d">ASK</text>
      <text x="1055" y="189" text-anchor="middle" font-size="23" font-weight="600" fill="#1a1814">Experts</text>
    </g>
    <!-- Trackers (Track) -->
    <g>
      <rect x="650" y="419" width="170" height="66" rx="12" fill="#f4efe6" stroke="#1a1814" stroke-width="2.5" />
      <text x="735" y="446" text-anchor="middle" font-family="ui-monospace, Menlo, monospace"
            font-size="12" letter-spacing="2" fill="#3d861d">TRACK</text>
      <text x="735" y="471" text-anchor="middle" font-size="23" font-weight="600" fill="#1a1814">Trackers</text>
    </g>
    <!-- Automations (Run) -->
    <g>
      <rect x="970" y="419" width="170" height="66" rx="12" fill="#f4efe6" stroke="#1a1814" stroke-width="2.5" />
      <text x="1055" y="446" text-anchor="middle" font-family="ui-monospace, Menlo, monospace"
            font-size="12" letter-spacing="2" fill="#3d861d">RUN</text>
      <text x="1055" y="471" text-anchor="middle" font-size="23" font-weight="600" fill="#1a1814">Automations</text>
    </g>
  </g>
</svg>
