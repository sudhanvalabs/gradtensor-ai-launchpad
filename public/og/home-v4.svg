<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f4efe6" />

  <!-- ===================== LEFT: TITLE BLOCK ===================== -->
  <g font-family="Fraunces, Georgia, 'Times New Roman', serif">
    <!-- Wordmark -->
    <text x="90" y="150" font-size="34" font-weight="700" letter-spacing="0.2">
      <tspan fill="#5fb32d">Grad</tspan><tspan fill="#1a1814">Tensor</tspan>
    </text>

    <!-- Headline. Same line as the site hero. -->
    <g font-weight="700" font-size="66">
      <text x="88" y="264" fill="#1a1814">Put AI</text>
      <text x="88" y="342" fill="#3d861d">to work.</text>
    </g>

    <!-- Green rule -->
    <rect x="90" y="402" width="58" height="4" fill="#5fb32d" />

    <!-- Subline -->
    <g fill="#6b645a" font-size="18" font-style="italic">
      <text x="90" y="440">Training, consulting, and Forge, our private</text>
      <text x="90" y="465">AI workspace for confidential work.</text>
    </g>
  </g>

  <!-- ===================== RIGHT: THE THREE PILLARS ===================== -->
  <g font-family="Fraunces, Georgia, 'Times New Roman', serif">

    <!-- Spine -->
    <line x1="628" y1="177" x2="628" y2="453"
          stroke="#1a1814" stroke-width="1.5" opacity="0.35" stroke-dasharray="4 5" />
    <g fill="none" stroke="#1a1814" stroke-width="1.5" opacity="0.4" stroke-dasharray="4 5">
      <path d="M 628,177 L 660,177" />
      <path d="M 628,315 L 660,315" />
      <path d="M 628,453 L 660,453" />
    </g>
    <circle cx="628" cy="177" r="5" fill="#1a1814" />
    <circle cx="628" cy="315" r="5" fill="#1a1814" />
    <circle cx="628" cy="453" r="5" fill="#5fb32d" />

    <!-- 01 Training -->
    <g>
      <rect x="660" y="123" width="460" height="108" rx="14"
            fill="#f4efe6" stroke="#1a1814" stroke-width="2.5" />
      <text x="694" y="169" font-family="ui-monospace, Menlo, monospace"
            font-size="12" letter-spacing="2.4" fill="#3d861d">TEACH</text>
      <text x="694" y="205" font-size="30" font-weight="600" fill="#1a1814">AI training</text>
      <text x="1090" y="205" text-anchor="end" font-size="18" font-style="italic" fill="#6b645a">corporates and colleges</text>
    </g>

    <!-- 02 Consulting -->
    <g>
      <rect x="660" y="261" width="460" height="108" rx="14"
            fill="#f4efe6" stroke="#1a1814" stroke-width="2.5" />
      <text x="694" y="307" font-family="ui-monospace, Menlo, monospace"
            font-size="12" letter-spacing="2.4" fill="#3d861d">DECIDE</text>
      <text x="694" y="343" font-size="30" font-weight="600" fill="#1a1814">AI consulting</text>
      <text x="1090" y="343" text-anchor="end" font-size="18" font-style="italic" fill="#6b645a">the Judgment Line</text>
    </g>

    <!-- 03 Forge. The product, marked apart by the green fill and the hexagon. -->
    <g>
      <rect x="660" y="399" width="460" height="108" rx="14"
            fill="#f4efe6" stroke="#1a1814" stroke-width="3" />
      <rect x="660" y="399" width="460" height="108" rx="14" fill="#5fb32d" opacity="0.1" />
      <text x="694" y="445" font-family="ui-monospace, Menlo, monospace"
            font-size="12" letter-spacing="2.4" fill="#3d861d">BUILD</text>
      <text x="694" y="481" font-size="30" font-weight="600" fill="#1a1814">Forge</text>
      <!-- Hexagon glyph, carried over from the previous mark -->
      <polygon points="1046,426 1077,444 1077,480 1046,498 1015,480 1015,444"
               fill="none" stroke="#1a1814" stroke-width="2.5" stroke-linejoin="round" />
      <polygon points="1046,426 1077,444 1077,480 1046,498 1015,480 1015,444"
               fill="#5fb32d" opacity="0.18" />
    </g>
  </g>
</svg>
