<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f4efe6" />

  <!-- ===================== LEFT: TITLE BLOCK ===================== -->
  <g font-family="Fraunces, Georgia, 'Times New Roman', serif">
    <!-- Wordmark -->
    <text x="90" y="188" font-size="34" font-weight="700" letter-spacing="0.2">
      <tspan fill="#5fb32d">Grad</tspan><tspan fill="#1a1814">Tensor</tspan>
    </text>

    <!-- Headline -->
    <g fill="#1a1814" font-weight="700" font-size="50">
      <text x="88" y="278">AI automation</text>
      <text x="88" y="336">for the physical</text>
      <text x="88" y="394">economy.</text>
    </g>

    <!-- Green rule -->
    <rect x="90" y="424" width="58" height="4" fill="#5fb32d" />

    <!-- Subline -->
    <g fill="#6b645a" font-size="19" font-style="italic">
      <text x="90" y="464">Governed AI, from back-office paperwork</text>
      <text x="90" y="490">to the plant floor. Always under your control.</text>
    </g>
  </g>

  <!-- ===================== RIGHT: PHYSICAL-ECONOMY CLUSTER ===================== -->
  <g>
    <!-- Short circuit connectors (each terminates on an icon, no dead ends) -->
    <g fill="none" stroke="#1a1814" stroke-width="1.5" opacity="0.4" stroke-dasharray="4 4">
      <path d="M 792,205 L 902,205" />           <!-- factory -> machinery -->
      <path d="M 735,372 L 792,372" />           <!-- gears -> crate -->
      <path d="M 968,378 L 1024,372" />          <!-- crate -> tools -->
      <path d="M 720,250 L 720,300" />           <!-- factory -> gears -->
    </g>
    <g fill="none" stroke="#5fb32d" stroke-width="1.5">
      <path d="M 735,178 L 735,150 L 772,150" /> <!-- factory accent lead -->
    </g>
    <circle cx="772" cy="150" r="4" fill="#5fb32d" />
    <circle cx="902" cy="205" r="4" fill="#1a1814" />

    <!-- FACTORY (upper-left of cluster) -->
    <g transform="translate(650,150)" stroke-linejoin="round">
      <path d="M 0,100 L 0,40 L 30,60 L 30,40 L 60,60 L 60,40 L 90,60 L 90,20 L 110,20 L 110,100 Z"
            fill="none" stroke="#1a1814" stroke-width="2.5" />
      <line x1="90" y1="35" x2="110" y2="35" stroke="#1a1814" stroke-width="2" />
      <rect x="15" y="70" width="12" height="12" fill="none" stroke="#1a1814" stroke-width="2" />
      <rect x="42" y="70" width="12" height="12" fill="#5fb32d" opacity="0.85" />
      <rect x="70" y="70" width="12" height="30" fill="none" stroke="#1a1814" stroke-width="2" />
      <line x1="-4" y1="100" x2="126" y2="100" stroke="#1a1814" stroke-width="3" />
    </g>

    <!-- MACHINERY (upper-right of cluster) -->
    <g transform="translate(908,162)" stroke-linejoin="round">
      <rect x="0" y="20" width="110" height="70" fill="none" stroke="#1a1814" stroke-width="2.5" />
      <rect x="18" y="36" width="40" height="40" fill="none" stroke="#1a1814" stroke-width="2" />
      <line x1="58" y1="56" x2="124" y2="56" stroke="#1a1814" stroke-width="4" />
      <rect x="124" y="41" width="15" height="30" fill="#5fb32d" />
      <circle cx="86" cy="46" r="12" fill="none" stroke="#1a1814" stroke-width="2" />
      <line x1="86" y1="46" x2="94" y2="39" stroke="#1a1814" stroke-width="2" />
      <line x1="0" y1="12" x2="110" y2="12" stroke="#1a1814" stroke-width="1.5" />
      <circle cx="10" cy="12" r="2.5" fill="#1a1814" />
      <circle cx="100" cy="12" r="2.5" fill="#1a1814" />
    </g>

    <!-- GEAR PAIR (left, mid) -->
    <g transform="translate(690,360)">
      <!-- large gear -->
      <g>
        <circle r="34" fill="none" stroke="#1a1814" stroke-width="2.5" />
        <circle r="11" fill="none" stroke="#1a1814" stroke-width="2" />
        <g fill="#1a1814">
          <rect x="-4.5" y="-43" width="9" height="11" transform="rotate(0)" />
          <rect x="-4.5" y="-43" width="9" height="11" transform="rotate(45)" />
          <rect x="-4.5" y="-43" width="9" height="11" transform="rotate(90)" />
          <rect x="-4.5" y="-43" width="9" height="11" transform="rotate(135)" />
          <rect x="-4.5" y="-43" width="9" height="11" transform="rotate(180)" />
          <rect x="-4.5" y="-43" width="9" height="11" transform="rotate(225)" />
          <rect x="-4.5" y="-43" width="9" height="11" transform="rotate(270)" />
          <rect x="-4.5" y="-43" width="9" height="11" transform="rotate(315)" />
        </g>
      </g>
      <!-- small green-hubbed gear -->
      <g transform="translate(50,42)">
        <circle r="19" fill="none" stroke="#1a1814" stroke-width="2" />
        <circle r="6.5" fill="#5fb32d" />
        <g fill="#1a1814">
          <rect x="-3.5" y="-25" width="7" height="8" transform="rotate(0)" />
          <rect x="-3.5" y="-25" width="7" height="8" transform="rotate(45)" />
          <rect x="-3.5" y="-25" width="7" height="8" transform="rotate(90)" />
          <rect x="-3.5" y="-25" width="7" height="8" transform="rotate(135)" />
          <rect x="-3.5" y="-25" width="7" height="8" transform="rotate(180)" />
          <rect x="-3.5" y="-25" width="7" height="8" transform="rotate(225)" />
          <rect x="-3.5" y="-25" width="7" height="8" transform="rotate(270)" />
          <rect x="-3.5" y="-25" width="7" height="8" transform="rotate(315)" />
        </g>
      </g>
    </g>

    <!-- SHIPPING CRATE ON PALLET (visual anchor, center) -->
    <g transform="translate(772,300)" stroke-linejoin="round">
      <!-- pallet -->
      <path d="M 0,110 L 100,70 L 200,110 L 100,150 Z" fill="none" stroke="#1a1814" stroke-width="2.5" />
      <path d="M 0,110 L 0,122 L 100,162 L 100,150 Z" fill="none" stroke="#1a1814" stroke-width="2" />
      <path d="M 100,162 L 200,122 L 200,110 L 100,150 Z" fill="none" stroke="#1a1814" stroke-width="2" />
      <line x1="33" y1="123" x2="33" y2="135" stroke="#1a1814" stroke-width="2" />
      <line x1="166" y1="123" x2="166" y2="135" stroke="#1a1814" stroke-width="2" />
      <!-- crate -->
      <path d="M 35,80 L 100,50 L 100,120 L 35,148 Z" fill="#f4efe6" stroke="#1a1814" stroke-width="2.5" />
      <path d="M 100,50 L 165,78 L 165,146 L 100,120 Z" fill="#5fb32d" opacity="0.15" stroke="#1a1814" stroke-width="2.5" />
      <path d="M 35,80 L 100,50 L 165,78 L 100,108 Z" fill="none" stroke="#1a1814" stroke-width="2.5" />
      <!-- up arrow accent -->
      <path d="M 128,112 L 128,74 M 118,86 L 128,72 L 138,86" fill="none" stroke="#5fb32d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- MAINTENANCE TOOLS (right) -->
    <g transform="translate(1030,352)">
      <!-- wrench -->
      <g transform="rotate(-18)">
        <rect x="-6" y="18" width="12" height="74" rx="4" fill="none" stroke="#1a1814" stroke-width="2.5" />
        <circle cx="0" cy="18" r="16" fill="#f4efe6" stroke="#1a1814" stroke-width="2.5" />
        <rect x="-8" y="4" width="16" height="16" fill="#f4efe6" />
        <path d="M -8,4 L -8,18 L 8,18 L 8,4" fill="none" stroke="#1a1814" stroke-width="2.5" />
        <circle cx="0" cy="92" r="12" fill="none" stroke="#1a1814" stroke-width="2.5" />
        <circle cx="0" cy="92" r="5" fill="#1a1814" />
      </g>
      <!-- pliers -->
      <g transform="translate(60,12) rotate(12)">
        <path d="M -11,38 C -14,72 -21,96 -21,108" fill="none" stroke="#5fb32d" stroke-width="7" stroke-linecap="round" />
        <path d="M 11,38 C 14,72 21,96 21,108" fill="none" stroke="#5fb32d" stroke-width="7" stroke-linecap="round" />
        <path d="M -11,38 C -14,72 -21,96 -21,108" fill="none" stroke="#1a1814" stroke-width="2" stroke-linecap="round" />
        <path d="M 11,38 C 14,72 21,96 21,108" fill="none" stroke="#1a1814" stroke-width="2" stroke-linecap="round" />
        <circle cx="0" cy="24" r="10" fill="#f4efe6" stroke="#1a1814" stroke-width="2.5" />
        <circle cx="0" cy="24" r="3" fill="#1a1814" />
        <path d="M -8,15 L -6,-1 L 0,-1 L 0,19 Z" fill="none" stroke="#1a1814" stroke-width="2.5" stroke-linejoin="round" />
        <path d="M 8,15 L 6,-1 L 0,-1 L 0,19 Z" fill="none" stroke="#1a1814" stroke-width="2.5" stroke-linejoin="round" />
      </g>
    </g>
  </g>
</svg>
